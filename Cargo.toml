[package]
name = "ApkToolKit"
version = "0.1.0"
edition = "2021"
description = "APK modding toolkit: extract, patch, rebuild, sign — no extraction required"
authors = ["ApkToolKit Contributors"]
license = "Apache-2.0"
repository = "https://github.com/example/ApkToolKit"

[dependencies]
# Reuse apkscope-core from the sibling crate
apkscope-core = { path = "../apkscope/core" }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
thiserror = "2.0"

# ZIP / archive handling
zip = "0.6"

# JSON for notes/metadata
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Atomic / concurrency
mimalloc = { version = "0.1", optional = true }

# GUI (egui, optional feature)
egui = { version = "0.25", optional = true }
eframe = { version = "0.25", optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"

[features]
default = ["mimalloc"]
gui = ["egui", "eframe"]
no-default-features = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
